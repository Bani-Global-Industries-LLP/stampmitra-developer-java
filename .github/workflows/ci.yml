name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Retry transient Maven Central failures ("Failed to read artifact descriptor ...") instead of failing the job.
  MAVEN_OPTS: -Dmaven.wagon.http.retryHandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 -Dmaven.wagon.http.retryHandler.requestSentEnabled=true
  # The conformance suite starts scripts/mock-server.mjs of the spec repo (checked out below, default branch).
  STAMPMITRA_SPEC_DIR: ${{ github.workspace }}/.openapi
  CONFORMANCE_REQUIRED: '1'

jobs:
  test:
    name: test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Bani-Global-Industries-LLP/stampmitra-developer-openapi
          path: .openapi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Compiles with -Xlint:all -Werror, runs checkstyle, unit + conformance tests, builds the javadoc jar
      # (doclint=all, warnings fail the build) and enforces the JaCoCo line-coverage minimum.
      - run: mvn -B verify
      - name: JaCoCo report
        if: matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco

  generated:
    name: generated code and spec coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/generate.mjs --check
      - run: node scripts/readme-snippets.mjs --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Every operation in spec/openapi.json has an SDK method
        run: mvn -B -q test -Dtest=SpecCoverageTest -Djacoco.skip=true

  examples:
    name: examples (run against the mock server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Bani-Global-Industries-LLP/stampmitra-developer-openapi
          path: .openapi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: scripts/run-examples.sh

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Dependency tree (convergence is enforced by maven-enforcer during verify)
        run: mvn -B dependency:tree
      - name: Install osv-scanner (pinned; module integrity verified by the Go checksum database)
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
      - name: OSV vulnerability scan of the Maven dependencies
        run: |
          osv="$(go env GOPATH)/bin/osv-scanner"
          # Root: scan the dependency tree exactly as Maven resolved it (SBOM), not osv-scanner's own pom resolver.
          mvn -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DoutputFormat=json -DoutputName=bom -DincludeTestScope=true
          "$osv" scan source -L target/bom.json
          # examples/pom.xml depends on the unpublished in.stampmitra:stampmitra-java, which no repository serves, so
          # transitive resolution would abort the scan. Scan its declared dependencies only (the SDK's own tree is
          # already covered by the SBOM above).
          "$osv" scan source --no-resolve -L examples/pom.xml
